services:
  bento-bot:
    build:
      context: .
      dockerfile: bento-bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bento
      DB_USER: bento
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       bento
      POSTGRES_USER:     bento
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bento"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
